<!DOCTYPE html>
<html>
    <head>
        <title>⚡ Bandwidth Checker ⚡</title>
        <meta name="description" content="A cool thing made with Glitch">
        <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="chart.bundle.min.js"></script>
        <style>
            :root {
                --bg-start: #0f1226;
                --bg-end: #1b1f3b;
                --card-bg: #191d3a;
                --card-border: #2c3163;
                --text-main: #e7e9f7;
                --text-dim: #9098c4;
                --accent: #38bdf8;
                --accent-2: #facc15;
                --outlier: #fb5a8c;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                background: radial-gradient(circle at top, var(--bg-end), var(--bg-start));
                color: var(--text-main);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            .page {
                width: 100%;
                max-width: 1600px;
                margin: 0 auto;
                padding: 32px 24px 56px;
                display: grid;
                grid-template-columns: 1fr;
                align-items: start;
                gap: 24px;
            }
            @media (min-width: 480px) {
                .page {
                    padding: 48px 32px 80px;
                    gap: 32px;
                }
            }
            .brand {
                grid-column: 1 / -1;
                font-size: 28px;
                font-weight: 700;
                letter-spacing: 0.5px;
                text-align: center;
            }
            @media (min-width: 900px) {
                .page {
                    grid-template-columns: 1fr 1fr;
                }
            }
            .card {
                width: 100%;
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 16px;
                padding: 28px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            }
            .card h2 {
                margin: 0 0 4px;
                font-size: 16px;
                font-weight: 600;
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            #chart-stats {
                margin: 4px 0 16px;
                font-size: 13px;
                color: var(--text-dim);
            }
            #chart-stats span { color: var(--text-main); font-weight: 600; }
            #chart-stats div { margin-bottom: 2px; }
            .chart-wrap {
                position: relative;
                width: 100%;
                height: 340px;
            }
            @media (min-width: 900px) {
                .chart-wrap { height: 520px; }
            }
            #myChart { cursor: grab; }
            #myChart.panning { cursor: grabbing; }
            .range-controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
                font-size: 13px;
                color: var(--text-dim);
            }
            .range-controls label {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .range-controls input[type="datetime-local"] {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid var(--card-border);
                border-radius: 8px;
                padding: 6px 8px;
                color: var(--text-main);
                font-size: 13px;
                font-family: inherit;
                color-scheme: dark;
            }
            .range-controls button {
                background: rgba(56, 189, 248, 0.12);
                color: var(--accent);
                border: 1px solid rgba(56, 189, 248, 0.4);
                border-radius: 8px;
                padding: 7px 14px;
                font-size: 13px;
                cursor: pointer;
                align-self: flex-end;
                transition: background 0.15s ease;
            }
            .range-controls button:hover { background: rgba(56, 189, 248, 0.25); }
            #range-hint {
                width: 100%;
                font-size: 11.5px;
                color: var(--text-dim);
                opacity: 0.8;
            }
            #low-outliers-stats, #daily-stats {
                margin: 4px 0 16px;
                font-size: 13px;
                color: var(--text-dim);
            }
            #low-outliers-stats span, #daily-stats span { color: var(--text-main); font-weight: 600; }
            .table-wrap {
                max-height: 420px;
                overflow-y: auto;
                border: 1px solid var(--card-border);
                border-radius: 10px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            th, td {
                text-align: left;
                padding: 8px 12px;
                border-bottom: 1px solid var(--card-border);
                white-space: nowrap;
            }
            thead th {
                position: sticky;
                top: 0;
                background: var(--card-bg);
                color: var(--text-dim);
                text-transform: uppercase;
                font-size: 11px;
                letter-spacing: 0.5px;
                z-index: 1;
            }
            tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
            td.speed-outlier { color: var(--outlier); font-weight: 600; }
            .daily-controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
                font-size: 13px;
                color: var(--text-dim);
            }
            .daily-controls label {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .daily-controls input[type="date"], .daily-controls select {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid var(--card-border);
                border-radius: 8px;
                padding: 6px 8px;
                color: var(--text-main);
                font-size: 13px;
                font-family: inherit;
                color-scheme: dark;
            }
            .daily-controls button {
                background: rgba(56, 189, 248, 0.12);
                color: var(--accent);
                border: 1px solid rgba(56, 189, 248, 0.4);
                border-radius: 8px;
                padding: 7px 14px;
                font-size: 13px;
                cursor: pointer;
                align-self: flex-end;
                transition: background 0.15s ease;
            }
            .daily-controls button:hover { background: rgba(56, 189, 248, 0.25); }
            #bandwidth-results {
                grid-column: 1 / -1;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="brand">⚡ Bandwidth Checker</div>

            <section class="card" id="bandwidth-results">
                <h2>Bandwidth Test Results</h2>
                <div class="range-controls">
                    <label>From
                        <input type="datetime-local" id="range-start">
                    </label>
                    <label>To
                        <input type="datetime-local" id="range-end">
                    </label>
                    <button id="range-reset" type="button">Reset zoom</button>
                    <span id="range-hint">Scroll to zoom around the cursor, drag to pan</span>
                </div>
                <div id="chart-stats"></div>
                <div class="chart-wrap">
                    <canvas id="myChart"></canvas>
                </div>
            </section>

            <section class="card" id="low-outliers">
                <h2>Low-Speed Outliers</h2>
                <div class="daily-controls">
                    <label>Machine
                        <select id="low-outliers-machine"></select>
                    </label>
                </div>
                <div id="low-outliers-stats"></div>
                <div class="table-wrap">
                    <table id="low-outliers-table">
                        <thead>
                            <tr><th>Date</th><th>Time</th><th>Speed (Mbps)</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="card" id="daily-stability">
                <h2>Daily Network Stability</h2>
                <div class="daily-controls">
                    <label>Machine
                        <select id="daily-machine"></select>
                    </label>
                    <label>Day
                        <input type="date" id="daily-date">
                    </label>
                    <button id="daily-prev" type="button">&lt; Prev day</button>
                    <button id="daily-next" type="button">Next day &gt;</button>
                </div>
                <div id="daily-stats"></div>
                <div class="chart-wrap">
                    <canvas id="dailyChart"></canvas>
                </div>
            </section>
        </div>

        <script>
            const safeDate = time => new Date(parseInt(time)).toUTCString();

            const quantile = (sorted, q) => {
              const pos = (sorted.length - 1) * q;
              const base = Math.floor(pos);
              const rest = pos - base;
              return sorted[base + 1] !== undefined
                ? sorted[base] + rest * (sorted[base + 1] - sorted[base])
                : sorted[base];
            };

            // Modified Z-score (Iglewicz & Hoaglin): robust to skewed/bimodal data because it's
            // built from the median and median absolute deviation (MAD) instead of mean/stddev,
            // which the earlier IQR-only approach let get pulled around by the low-speed cluster.
            // Lower OUTLIER_THRESHOLD to flag more points, raise it to flag fewer.
            const OUTLIER_THRESHOLD = 1.5;

            const computeStats = values => {
              const sorted = [...values].sort((a, b) => a - b);
              const median = quantile(sorted, 0.5);
              const deviations = values.map(v => Math.abs(v - median)).sort((a, b) => a - b);
              const mad = quantile(deviations, 0.5) || 0;
              // Mbps distance from the median that a point needs to exceed to be flagged
              const flagDistance = mad === 0 ? 0 : (OUTLIER_THRESHOLD * mad) / 0.6745;
              return {
                median,
                mad,
                lowerBound: median - flagDistance,
                upperBound: median + flagDistance
              };
            };

            // Minimum visible span so wheel-zoom / manual input can't collapse the range to nothing
            const MIN_RANGE_MS = 60 * 1000;

            // distinguishable colors so each reporting machine gets its own consistent series color
            const PALETTE = [
              { bg: 'rgba(56, 189, 248, 0.85)', border: 'rgba(56, 189, 248, 1)' },
              { bg: 'rgba(251, 90, 140, 0.85)', border: 'rgba(251, 90, 140, 1)' },
              { bg: 'rgba(250, 204, 21, 0.85)', border: 'rgba(250, 204, 21, 1)' },
              { bg: 'rgba(52, 211, 153, 0.85)', border: 'rgba(52, 211, 153, 1)' },
              { bg: 'rgba(167, 139, 250, 0.85)', border: 'rgba(167, 139, 250, 1)' }
            ];

            const machineLabel = meta => {
              if (!meta) return 'Unknown';
              const name = meta.hostname || meta.ip || meta.mac || 'Unknown';
              return meta.connection ? `${name} (${meta.connection})` : name;
            };

            // keyed by machine identity (mac, falling back to ip/hostname) so each machine's
            // readings and outlier stats stay independent — mixing e.g. ethernet and wifi speeds
            // would make median/outlier detection meaningless
            let machinesData = {};
            let machineKeys = [];
            let dataMin = 0;
            let dataMax = 0;
            let currentMin = 0;
            let currentMax = 0;
            let chartInstance = null;

            // drag-to-pan state
            let isPanning = false;
            let panStartClientX = 0;
            let panStartMin = 0;
            let panStartMax = 0;
            let panPixelsPerMs = 0;

            const rangeStartInput = document.getElementById('range-start');
            const rangeEndInput = document.getElementById('range-end');
            const rangeResetButton = document.getElementById('range-reset');

            const toInputValue = ms => {
              const d = new Date(ms);
              const pad = n => String(n).padStart(2, '0');
              return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };

            const fromInputValue = value => {
              const ms = new Date(value).getTime();
              return Number.isNaN(ms) ? null : ms;
            };

            const buildChart = () => {
              const ctx = document.getElementById('myChart').getContext('2d');
              const datasets = [];
              machineKeys.forEach((key, i) => {
                const colors = PALETTE[i % PALETTE.length];
                const label = machineLabel(machinesData[key].meta);
                datasets.push({
                  label: `${label} — normal`,
                  data: [],
                  showLine: false,
                  backgroundColor: colors.bg,
                  borderColor: colors.border,
                  borderWidth: 1,
                  pointRadius: 4,
                  machineKey: key,
                  kind: 'normal'
                });
                datasets.push({
                  label: `${label} — outliers`,
                  data: [],
                  showLine: false,
                  backgroundColor: 'rgba(251, 90, 140, 0.9)',
                  borderColor: 'rgba(251, 90, 140, 1)',
                  borderWidth: 1,
                  pointRadius: 4,
                  machineKey: key,
                  kind: 'outlier'
                });
                datasets.push({
                  label: `${label} — median`,
                  data: [],
                  showLine: true,
                  borderColor: colors.border,
                  borderWidth: 2,
                  borderDash: [8, 5],
                  pointRadius: 0,
                  fill: false,
                  machineKey: key,
                  kind: 'median'
                });
              });
              chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    xAxes: [{
                      type: 'linear',
                      position: 'bottom',
                      ticks: {
                        userCallback: (label, index, labels) => safeDate(label),
                        fontColor: '#9098c4'
                      },
                      gridLines: { color: 'rgba(255,255,255,0.06)' },
                      scaleLabel: {
                        display: true,
                        labelString: 'Date',
                        fontColor: '#9098c4'
                      }
                    }],
                    yAxes: [{
                      scaleLabel: {
                        display: true,
                        labelString: 'Mbps',
                        fontColor: '#9098c4'
                      },
                      ticks: {
                        beginAtZero: true,
                        fontColor: '#9098c4'
                      },
                      gridLines: { color: 'rgba(255,255,255,0.06)' }
                    }],
                  },
                  legend: {
                    display: true,
                    labels: { fontColor: '#9098c4' }
                  },
                  tooltips: {
                    callbacks: {
                      label: function(tooltipItem, data) {
                        const label = data.datasets[tooltipItem.datasetIndex].label;
                        return `${label}: ${tooltipItem.value} Mbps @ ${safeDate(tooltipItem.label)}`;
                      }
                    }
                  }
                }
              });

              const canvas = document.getElementById('myChart');
              canvas.addEventListener('wheel', onWheelZoom, { passive: false });
              canvas.addEventListener('mousedown', onPanStart);
              window.addEventListener('mousemove', onPanMove);
              window.addEventListener('mouseup', onPanEnd);
              window.addEventListener('blur', onPanEnd);
            };

            const updateChartForRange = (min, max) => {
              const statsEl = document.getElementById('chart-stats');

              chartInstance.options.scales.xAxes[0].ticks.min = min;
              chartInstance.options.scales.xAxes[0].ticks.max = max;

              let totalVisible = 0;
              const summaries = [];
              machineKeys.forEach(key => {
                const machine = machinesData[key];
                const visible = machine.points.filter(p => p.x >= min && p.x <= max);
                const isOutlier = v => v < machine.stats.lowerBound || v > machine.stats.upperBound;
                totalVisible += visible.length;
                summaries.push(
                  `<div><strong>${machineLabel(machine.meta)}</strong>: median <span>${machine.stats.median.toFixed(2)} Mbps</span> ` +
                  `&nbsp;·&nbsp; outliers <span>${visible.filter(p => isOutlier(p.y)).length}</span> of <span>${visible.length}</span> ` +
                  `(outside <span>${Math.max(0, machine.stats.lowerBound).toFixed(1)}</span>–<span>${machine.stats.upperBound.toFixed(1)}</span> Mbps, ` +
                  `calculated for this machine only)</div>`
                );
              });

              chartInstance.data.datasets.forEach(ds => {
                const machine = machinesData[ds.machineKey];
                if (ds.kind === 'median') {
                  ds.data = [{ x: min, y: machine.stats.median }, { x: max, y: machine.stats.median }];
                  return;
                }
                const visible = machine.points.filter(p => p.x >= min && p.x <= max);
                const isOutlier = v => v < machine.stats.lowerBound || v > machine.stats.upperBound;
                ds.data = ds.kind === 'outlier' ? visible.filter(p => isOutlier(p.y)) : visible.filter(p => !isOutlier(p.y));
              });
              chartInstance.update();

              statsEl.innerHTML = totalVisible ? summaries.join('') : 'No data in the selected range.';
            };


            const setRange = (min, max) => {
              min = Math.max(dataMin, Math.min(min, dataMax));
              max = Math.max(dataMin, Math.min(max, dataMax));
              if (min > max) { const tmp = min; min = max; max = tmp; }
              if (max - min < MIN_RANGE_MS) {
                const mid = (min + max) / 2;
                min = Math.max(dataMin, mid - MIN_RANGE_MS / 2);
                max = Math.min(dataMax, min + MIN_RANGE_MS);
              }
              currentMin = min;
              currentMax = max;
              rangeStartInput.value = toInputValue(min);
              rangeEndInput.value = toInputValue(max);
              updateChartForRange(min, max);
            };

            const onWheelZoom = evt => {
              if (!chartInstance) return;
              evt.preventDefault();
              const xScaleId = Object.keys(chartInstance.scales).find(id => chartInstance.scales[id].isHorizontal());
              const xScale = chartInstance.scales[xScaleId];
              if (!xScale) return;
              const rect = evt.currentTarget.getBoundingClientRect();
              const cursorValue = xScale.getValueForPixel(evt.clientX - rect.left);
              const width = currentMax - currentMin;
              const factor = evt.deltaY < 0 ? 0.8 : 1.25; // deltaY < 0 => scroll up => zoom in
              const fullWidth = dataMax - dataMin;
              const newWidth = Math.min(fullWidth, Math.max(MIN_RANGE_MS, width * factor));
              const ratio = width === 0 ? 0.5 : (cursorValue - currentMin) / width;
              let newMin = cursorValue - newWidth * ratio;
              let newMax = cursorValue + newWidth * (1 - ratio);
              if (newMin < dataMin) { newMax += dataMin - newMin; newMin = dataMin; }
              if (newMax > dataMax) { newMin -= newMax - dataMax; newMax = dataMax; }
              setRange(newMin, newMax);
            };

            const onPanStart = evt => {
              if (evt.button !== 0 || !chartInstance) return;
              const xScaleId = Object.keys(chartInstance.scales).find(id => chartInstance.scales[id].isHorizontal());
              const xScale = chartInstance.scales[xScaleId];
              if (!xScale || currentMax === currentMin) return;
              const pxMin = xScale.getPixelForValue(currentMin);
              const pxMax = xScale.getPixelForValue(currentMax);
              if (pxMax === pxMin) return;
              isPanning = true;
              panStartClientX = evt.clientX;
              panStartMin = currentMin;
              panStartMax = currentMax;
              panPixelsPerMs = (pxMax - pxMin) / (currentMax - currentMin);
              evt.currentTarget.classList.add('panning');
              evt.preventDefault();
            };

            const onPanMove = evt => {
              if (!isPanning) return;
              evt.preventDefault();
              const deltaValue = (evt.clientX - panStartClientX) / panPixelsPerMs;
              // dragging follows the cursor: moving right reveals earlier points, so subtract the delta
              let newMin = panStartMin - deltaValue;
              let newMax = panStartMax - deltaValue;
              if (newMin < dataMin) { newMax += dataMin - newMin; newMin = dataMin; }
              if (newMax > dataMax) { newMin -= newMax - dataMax; newMax = dataMax; }
              setRange(newMin, newMax);
            };

            const onPanEnd = () => {
              if (!isPanning) return;
              isPanning = false;
              document.getElementById('myChart').classList.remove('panning');
            };

            rangeStartInput.addEventListener('change', () => {
              const min = fromInputValue(rangeStartInput.value);
              if (min !== null) setRange(min, currentMax);
            });
            rangeEndInput.addEventListener('change', () => {
              const max = fromInputValue(rangeEndInput.value);
              if (max !== null) setRange(currentMin, max);
            });
            rangeResetButton.addEventListener('click', () => setRange(dataMin, dataMax));

            const initGraph = ({ machines, series }) => {
              machineKeys = Object.keys(series || {}).filter(key => series[key].length);
              machinesData = {};
              machineKeys.forEach(key => {
                const points = series[key]
                  .map(d => ({ x: Number(d.x), y: Number(d.y) }))
                  .sort((a, b) => a.x - b.x);
                machinesData[key] = {
                  meta: (machines && machines[key]) || {},
                  points,
                  stats: computeStats(points.map(p => p.y))
                };
              });
              if (!machineKeys.length) return;

              dataMin = Math.min(...machineKeys.map(key => machinesData[key].points[0].x));
              dataMax = Math.max(...machineKeys.map(key => {
                const pts = machinesData[key].points;
                return pts[pts.length - 1].x;
              }));

              buildChart();
              setRange(dataMin, dataMax);
              populateMachineSelectors();
              renderLowOutlierTable();
              initDailyStabilityChart();
            };

            fetch('/read')
              .then(response => response.json())
              .then(json => initGraph(json));
        </script>
        <script>
          // fixed cutoff (not the statistical outlier bound) — anything under this is worth a look regardless of a machine's usual spread
          const LOW_SPEED_THRESHOLD_MBPS = 10.0;

          const pad2 = n => String(n).padStart(2, '0');
          const formatDateDDMMYYYY = d => `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}-${d.getFullYear()}`;
          const formatTimeHHMMSS = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;

          const lowOutliersMachineSelect = document.getElementById('low-outliers-machine');
          const lowOutliersTableBody = document.querySelector('#low-outliers-table tbody');
          const lowOutliersStats = document.getElementById('low-outliers-stats');

          const populateMachineSelectors = () => {
            [lowOutliersMachineSelect, dailyMachineSelect].forEach(select => {
              const previousValue = select.value;
              select.innerHTML = machineKeys
                .map(key => `<option value="${key}">${machineLabel(machinesData[key].meta)}</option>`)
                .join('');
              select.value = machineKeys.includes(previousValue) ? previousValue : machineKeys[0];
            });
          };

          const renderLowOutlierTable = () => {
            const machine = machinesData[lowOutliersMachineSelect.value];
            if (!machine) return;
            const lowPoints = machine.points
              .filter(p => p.y < LOW_SPEED_THRESHOLD_MBPS)
              .sort((a, b) => b.x - a.x);

            lowOutliersStats.innerHTML =
              `<span>${lowPoints.length}</span> reading(s) below <span>${LOW_SPEED_THRESHOLD_MBPS.toFixed(1)} Mbps</span> ` +
              `(median: <span>${machine.stats.median.toFixed(2)} Mbps</span>)`;

            lowOutliersTableBody.innerHTML = lowPoints.length
              ? lowPoints.map(p => {
                  const d = new Date(p.x);
                  return `<tr><td>${formatDateDDMMYYYY(d)}</td><td>${formatTimeHHMMSS(d)}</td>` +
                    `<td class="speed-outlier">${p.y.toFixed(2)}</td></tr>`;
                }).join('')
              : '<tr><td colspan="3">No low-speed outliers recorded.</td></tr>';
          };


          const dailyMachineSelect = document.getElementById('daily-machine');
          const dailyDateInput = document.getElementById('daily-date');
          const dailyStats = document.getElementById('daily-stats');
          let dailyChartInstance = null;


          const dayBounds = dateStr => {
            const [y, m, d] = dateStr.split('-').map(Number);
            return {
              start: new Date(y, m - 1, d, 0, 0, 0, 0).getTime(),
              end: new Date(y, m - 1, d, 23, 59, 59, 999).getTime()
            };
          };

          const toDateInputValue = ms => {
            const d = new Date(ms);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          };

          const buildDailyChart = () => {
            const ctx = document.getElementById('dailyChart').getContext('2d');
            dailyChartInstance = new Chart(ctx, {
              type: 'line',
              data: {
                datasets: [{
                  label: 'Speed',
                  data: [],
                  showLine: true,
                  borderColor: 'rgba(56, 189, 248, 1)',
                  backgroundColor: 'rgba(56, 189, 248, 0.15)',
                  pointBackgroundColor: 'rgba(56, 189, 248, 1)',
                  borderWidth: 2,
                  pointRadius: 3,
                  lineTension: 0,
                  fill: false
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: { display: false },
                scales: {
                  xAxes: [{
                    type: 'linear',
                    position: 'bottom',
                    ticks: {
                      userCallback: label => new Date(label).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                      fontColor: '#9098c4'
                    },
                    gridLines: { color: 'rgba(255,255,255,0.06)' },
                    scaleLabel: { display: true, labelString: 'Time', fontColor: '#9098c4' }
                  }],
                  yAxes: [{
                    scaleLabel: { display: true, labelString: 'Mbps', fontColor: '#9098c4' },
                    ticks: { beginAtZero: true, fontColor: '#9098c4' },
                    gridLines: { color: 'rgba(255,255,255,0.06)' }
                  }]
                },
                tooltips: {
                  callbacks: {
                    label: tooltipItem => `${tooltipItem.value} Mbps @ ${new Date(Number(tooltipItem.label)).toLocaleTimeString()}`
                  }
                }
              }
            });
          };

          const renderDailyChart = () => {
            const machine = machinesData[dailyMachineSelect.value];
            if (!machine || !dailyDateInput.value) return;
            const { start, end } = dayBounds(dailyDateInput.value);
            const dayPoints = machine.points.filter(p => p.x >= start && p.x <= end).sort((a, b) => a.x - b.x);
            const isOutlier = v => v < machine.stats.lowerBound || v > machine.stats.upperBound;
            const pointColors = dayPoints.map(p => isOutlier(p.y) ? 'rgba(251, 90, 140, 1)' : 'rgba(56, 189, 248, 1)');

            dailyChartInstance.options.scales.xAxes[0].ticks.min = start;
            dailyChartInstance.options.scales.xAxes[0].ticks.max = end;
            dailyChartInstance.data.datasets[0].data = dayPoints;
            dailyChartInstance.data.datasets[0].pointBackgroundColor = pointColors;
            dailyChartInstance.data.datasets[0].pointBorderColor = pointColors;
            dailyChartInstance.update();

            const outlierCount = dayPoints.filter(p => isOutlier(p.y)).length;
            const dayLabel = new Date(start).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            dailyStats.innerHTML = dayPoints.length
              ? `<span>${dayPoints.length}</span> reading(s) on <span>${dayLabel}</span> &nbsp;·&nbsp; ` +
                `<span>${outlierCount}</span> outlier(s) shown in pink ` +
                `(outside <span>${Math.max(0, machine.stats.lowerBound).toFixed(1)}</span>–<span>${machine.stats.upperBound.toFixed(1)}</span> Mbps for this machine)`
              : `No readings on <span>${dayLabel}</span>`;
          };

          const shiftDailyDate = deltaDays => {
            const { start } = dayBounds(dailyDateInput.value);
            dailyDateInput.value = toDateInputValue(start + deltaDays * 24 * 60 * 60 * 1000);
            renderDailyChart();
          };

          const initDailyStabilityChart = () => {
            dailyDateInput.min = toDateInputValue(dataMin);
            dailyDateInput.max = toDateInputValue(dataMax);
            if (!dailyDateInput.value) dailyDateInput.value = toDateInputValue(dataMax);
            if (!dailyChartInstance) buildDailyChart();
            renderDailyChart();
          };

          dailyMachineSelect.addEventListener('change', renderDailyChart);
          lowOutliersMachineSelect.addEventListener('change', renderLowOutlierTable);
          dailyDateInput.addEventListener('change', renderDailyChart);
          document.getElementById('daily-prev').addEventListener('click', () => shiftDailyDate(-1));
          document.getElementById('daily-next').addEventListener('click', () => shiftDailyDate(1));
        </script>
    </body>
</html>
