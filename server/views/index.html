<!DOCTYPE html>
<html>
    <head>
        <title>⚡ Bandwidth Checker ⚡</title>
        <meta name="description" content="A cool thing made with Glitch">
        <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="chart.bundle.min.js"></script>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="page">
            <div class="brand">⚡ Bandwidth Checker</div>

            <section class="card" id="bandwidth-results">
                <h2>Bandwidth Test Results</h2>
                <div class="range-controls">
                    <label>From
                        <input type="datetime-local" id="range-start">
                    </label>
                    <label>To
                        <input type="datetime-local" id="range-end">
                    </label>
                    <button id="range-reset" type="button">Reset zoom</button>
                    <span id="range-hint">Scroll or pinch to zoom, drag or swipe to pan</span>
                </div>
                <div id="chart-stats"></div>
                <div class="chart-wrap">
                    <canvas id="myChart"></canvas>
                </div>
            </section>

            <section class="card" id="low-outliers">
                <h2>Low-Speed Outliers</h2>
                <div id="low-outliers-stats"></div>
                <div class="table-wrap">
                    <table id="low-outliers-table">
                        <thead>
                            <tr>
                                <th data-sort="machine">Machine <span class="sort-indicator"></span></th>
                                <th data-sort="date">Date <span class="sort-indicator"></span></th>
                                <th data-sort="time">Time <span class="sort-indicator"></span></th>
                                <th data-sort="speed">Speed (Mbps) <span class="sort-indicator"></span></th>
                            </tr>
                            <tr class="filter-row">
                                <th><input type="text" data-filter="machine" placeholder="Filter..."></th>
                                <th><input type="text" data-filter="date" placeholder="Filter..."></th>
                                <th><input type="text" data-filter="time" placeholder="Filter..."></th>
                                <th><input type="text" data-filter="speed" placeholder="Filter..."></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="card" id="daily-stability">
                <h2>Daily Network Stability</h2>
                <div class="daily-controls">
                    <label>Machine
                        <select id="daily-machine"></select>
                    </label>
                    <label>Day
                        <input type="date" id="daily-date">
                    </label>
                    <button id="daily-prev" type="button">&lt; Prev day</button>
                    <button id="daily-next" type="button">Next day &gt;</button>
                </div>
                <div id="daily-stats"></div>
                <div class="chart-wrap">
                    <canvas id="dailyChart"></canvas>
                </div>
            </section>
        </div>

        <script src="js/stats.js"></script>
        <script src="js/zoom-pan.js"></script>
        <script src="js/low-outliers.js"></script>
        <script src="js/daily-chart.js"></script>
        <script src="js/main-chart.js"></script>
    </body>
</html>
