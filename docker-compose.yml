services:
  server:
    build: ./server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SECRET: ${SECRET}
      PORT: "3000"
      DB_PATH: /app/config/db.json
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config

  client:
    build: ./client
    depends_on:
      - server
    environment:
      SERVER_URL: "http://server:3000/save"
      SECRET: ${SECRET}
      TEST_INTERVAL: ${TEST_INTERVAL:-3600}

  connectivity:
    build: ./client
    depends_on:
      - server
    network_mode: host  # must see the host's WiFi interface via netlink
    cap_add:
      - NET_ADMIN
    environment:
      WIFI_IFACE: ${WIFI_IFACE:-wlan0}
      LOG_DIR: /app/config
      # server is reachable on localhost because the server port is exposed to the host
      SERVER_URL: "http://localhost:${PORT:-3000}"
      SECRET: ${SECRET}
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
    command: ["python", "connectivity.py"]
