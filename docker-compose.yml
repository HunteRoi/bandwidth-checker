services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SECRET: ${SECRET}
      PORT: "3000"
      DB_PATH: /app/config/db.json
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: "http://server:3000/save"
      SECRET: ${SECRET}
      TEST_INTERVAL: ${TEST_INTERVAL:-3600}
      # labels this machine's readings in the dashboard, e.g. "wifi" or "ethernet"
      CONNECTION_LABEL: ${CONNECTION_LABEL:-wifi}

  connectivity:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    network_mode: host  # shares host network namespace so /sys/class/net shows host interfaces
    environment:
      WIFI_IFACE: ${WIFI_IFACE:-wlan0}
      POLL_MS: ${POLL_MS:-200}
      DEBOUNCE_MS: ${DEBOUNCE_MS:-3000}
      LOG_DIR: /app/config
      # server reachable on localhost because its port is published to the host
      SERVER_URL: "http://localhost:${PORT:-3000}"
      SECRET: ${SECRET}
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
    command: ["python", "connectivity.py"]
