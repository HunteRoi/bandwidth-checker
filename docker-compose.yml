services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      SECRET: ${SECRET}
      PORT: "3000"
      DB_PATH: /app/config/db.json
      OUTLIER_THRESHOLD: ${OUTLIER_THRESHOLD:-1.5}
      MAD_CONSISTENCY_CONSTANT: ${MAD_CONSISTENCY_CONSTANT:-0.6745}
      MIN_RANGE_MS: ${MIN_RANGE_MS:-60000}
      LOW_SPEED_THRESHOLD_MBPS: ${LOW_SPEED_THRESHOLD_MBPS:-10.0}
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    network_mode: host  # shares the host's network namespace so the reported IP/MAC are the host's, not the container's
    volumes:
      - /etc/hostname:/etc/hostname:ro
    environment:
      # host networking bypasses the compose DNS, so point this at wherever the server actually
      # lives — "http://localhost:3000/save" if server+client run on the same host,
      # otherwise the server host's LAN address, e.g. "http://192.168.1.50:3000/save"
      SERVER_URL: ${SERVER_URL:-http://localhost:3000/save}
      SECRET: ${SECRET}
      TEST_INTERVAL: ${TEST_INTERVAL:-3600}
      # labels this machine's readings in the dashboard, e.g. "wifi" or "ethernet"
      CONNECTION_LABEL: ${CONNECTION_LABEL:-wifi}
      # host interface to read the MAC from, e.g. eth0 (check with: ip link show)
      HOST_IFACE: ${HOST_IFACE:-}
